:root{--rail:56px;--side:320px;--tools:48px;--sans:Inter;--mono:JBM}
.a{--bg:#0B0C0E;--surf:#0F1113;--pop:#15171A;--line:#1C1F23;--line2:#15171A;--text:#E7E9EC;--mut:#7D848E;--dim:#4A5059;--up:#2EBD85;--dn:#F0506E;--acc:#E7E9EC;--accbg:#1A1D21;--hov:#16191C;--ema1:#C9CDD3;--ema2:#6B727C;--l3:#D9B26A;--draw:#6EA8FE;--draw2:#D9B26A;--shadow:0 12px 32px rgba(0,0,0,.5),0 0 0 1px #23272C}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 13px/16px var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1;overflow:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--side);height:100vh}
/* app rail */
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.logo{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;margin:4px 0 16px;background:var(--acc);color:var(--bg);font:600 13px var(--sans)}
.ri{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--mut);position:relative}
.ri svg{width:20px;height:20px}
.ri.on{color:var(--text);background:var(--accbg)}
.ri.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--acc)}
.spacer{flex:1}
/* main */
.main{display:grid;grid-template-rows:56px minmax(0,1fr) 32px;min-width:0;border-right:1px solid var(--line)}
.bar{white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:24px;padding:0 16px;border-bottom:1px solid var(--line)}
.sym{display:flex;align-items:baseline;gap:8px}
.sym b{font:600 16px var(--sans);letter-spacing:-.01em}
.sym span{color:var(--mut);font-size:12px}
.px{display:flex;align-items:baseline;gap:12px}
.px .p{font:500 16px var(--mono)}
.up{color:var(--up)}.dn{color:var(--dn)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat i{font-style:normal;color:var(--mut);font-size:11px;line-height:12px}
.stat em{font:400 12px/14px var(--mono);font-style:normal}
.seg{display:flex;gap:2px;margin-left:auto;padding:2px;border:1px solid var(--line);border-radius:8px}
.seg span{font:500 12px var(--sans);color:var(--mut);padding:4px 8px;border-radius:6px}
.seg span.on{background:var(--accbg);color:var(--text)}
.btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-weight:500;font-size:12px;color:var(--text)}
.btn svg{width:16px;height:16px}
.btn.icon{padding:0;width:32px;justify-content:center;color:var(--mut)}
.btn.on{background:var(--accbg)}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 20%,transparent)}
.work{display:grid;grid-template-columns:var(--tools) minmax(0,1fr);min-height:0;position:relative}
/* drawing toolbar */
.tools{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px}
.tb{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--mut);position:relative}
.tb svg{width:18px;height:18px}
.tb.grp::after{content:"";position:absolute;right:3px;bottom:3px;border:3px solid transparent;border-right-color:var(--dim);border-bottom-color:var(--dim)}
.tb.on{background:var(--accbg);color:var(--text)}
.tb.act{color:var(--draw)}
.tsep{width:16px;height:1px;background:var(--line);margin:6px 0}
.panes{display:grid;min-height:0}
.pane{position:relative;border-bottom:1px solid var(--line);min-height:0}
.pane:last-child{border-bottom:0}
.pane canvas{position:absolute;inset:0;width:100%;height:100%}
.leg{position:absolute;left:12px;top:8px;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mut);z-index:2}
.lr{align-self:flex-start;display:flex;gap:10px;align-items:center;height:22px;padding:0 6px;border-radius:6px;margin-left:-6px}
.lr b{color:var(--text);font-weight:500}
.lr .v{color:var(--text)}
.lr .k{display:inline-block;width:8px;height:2px;border-radius:1px;vertical-align:middle}
.lr.hov{background:var(--hov);box-shadow:0 0 0 1px var(--line)}
.lr.off{opacity:.45}
.ctl{display:flex;gap:2px;margin-left:4px}
.ctl span{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--mut)}
.ctl span svg{width:14px;height:14px}
.ctl span.hl{color:var(--text);background:var(--accbg)}
.pctl{position:absolute;top:6px;right:80px;display:flex;gap:2px;z-index:3;padding:2px;border-radius:6px;background:var(--surf);box-shadow:0 0 0 1px var(--line)}
.pctl span{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--mut)}
.pctl span svg{width:14px;height:14px}
.coll{display:flex;align-items:center;gap:10px;padding:0 12px;font-size:11px;color:var(--mut)}
.coll b{color:var(--text);font-weight:500}
.coll .r{margin-left:auto;display:flex;gap:2px}
.coll .r span{width:24px;height:24px;display:grid;place-items:center;border-radius:4px}
.coll .r svg{width:14px;height:14px}
.foot{display:flex;align-items:center;gap:16px;padding:0 16px;font-size:11px;color:var(--mut)}
.foot .r{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:10px;background:var(--accbg);color:var(--text);font-size:11px}
.chip svg{width:12px;height:12px}

.fly{position:absolute;left:52px;top:44px;width:272px;background:var(--pop);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:10}
.fh{font:500 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:10px 10px 6px}
.fr{display:flex;align-items:center;gap:12px;height:32px;padding:0 10px;border-radius:6px;color:var(--text)}
.fr svg{width:18px;height:18px;color:var(--mut)}
.fr kbd{margin-left:auto;font:400 11px var(--mono);color:var(--mut)}
.fr .st{margin-left:auto;color:var(--dim)}

.fr.hov{background:var(--accbg)}
.fr.hov svg{color:var(--text)}
.fr .st svg{width:14px;height:14px}
.fr .st.on{color:var(--draw2)}

.fsep{height:1px;background:var(--line);margin:6px 4px}

.otb span svg{width:16px;height:16px}

.otb i{width:1px;height:16px;background:var(--line);margin:0 4px}
.otb .txt{font-family:var(--sans);color:var(--text)}

.side{display:grid;grid-template-rows:56px minmax(0,1fr) auto;min-height:0;background:var(--surf)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px}
.tabs span{font:500 12px var(--sans);color:var(--mut);padding:5px 10px;border-radius:6px}
.tabs span.on{background:var(--accbg);color:var(--text)}
.ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--mut)}
.ic svg{width:16px;height:16px}
.search{margin:12px 16px 8px;height:36px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--mut);background:var(--bg)}
.search svg{width:16px;height:16px}
.search kbd{margin-left:auto;font:500 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--mut)}
.cols{display:grid;grid-template-columns:1fr 96px 64px;padding:8px 16px;font-size:11px;color:var(--dim)}
.cols span:not(:first-child){text-align:right}
.row{display:grid;grid-template-columns:1fr 96px 64px;align-items:center;height:40px;padding:0 16px;position:relative}
.row span:not(:first-child){text-align:right}
.row .s b{font-weight:500}
.row .s i{font-style:normal;color:var(--dim);font-size:11px;margin-left:4px}
.row.on{background:var(--accbg)}
.row.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--acc)}
.chg{font:500 12px var(--mono)}
.card{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card h4{grid-column:1/-1;font-size:12px;font-weight:600;display:flex;justify-content:space-between}
.card h4 span{font-weight:400;color:var(--mut)}
.kv i{display:block;font-style:normal;color:var(--mut);font-size:11px;margin-bottom:4px}
.kv em{font:400 13px var(--mono);font-style:normal}
/* object tree */
.ot{padding:8px 0;overflow:hidden}
.oh{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;font:500 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.oh .r{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--mut);font-weight:400;display:flex;align-items:center;gap:4px}
.oh svg{width:14px;height:14px}
.or{display:grid;grid-template-columns:16px 24px 1fr auto 24px;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;color:var(--text)}
.or svg{width:14px;height:14px}
.or .h{color:var(--dim)}
.or .e{color:var(--mut);display:grid;place-items:center}
.or .n{display:flex;align-items:center;gap:8px;min-width:0}
.or .n i{font-style:normal;color:var(--mut);font-size:11px}
.or .t{font:400 11px var(--mono);color:var(--mut)}
.or .x{color:var(--dim);display:grid;place-items:center}
.or.off .n,.or.off .t{opacity:.45}
.or.hov{background:var(--hov)}
.or.hov .x{color:var(--mut)}
.or .k{width:10px;height:2px;border-radius:1px;display:inline-block}
.odiv{height:1px;background:var(--line);margin:8px 16px}
.oft{border-top:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.oft .btn{justify-content:center}
.oft .tpl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);height:28px}
.oft .tpl b{color:var(--text);font-weight:500}
</style></head>

 const hi=Math.max(...D.map(d=>d.h)),lo=Math.min(...D.map(d=>d.l));const pad=(hi-lo)*.05;const H=hi+pad,L=lo-pad;
 const Y=v=>top+(H-v)/(H-L)*(h-top-bot-volH-8);const X=i=>step*(i+.5);

function sub(id,series,rng,lines,dec){const [x,w,h]=setup(id);const top=36,bot=8;const cw=w-AX;const step=cw/(N+6);const [L,H]=rng;const Y=v=>top+(H-v)/(H-L)*(h-top-bot);
