name: quanta

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: quanta-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quanta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quanta_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quanta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quanta} -d ${POSTGRES_DB:-quanta}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: quanta-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
