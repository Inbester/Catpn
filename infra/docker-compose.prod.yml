name: quanta-prod

# The server stack. Four containers, one network, nothing published to the
# internet.
#
#   docker compose -f infra/docker-compose.prod.yml up -d --build
#
# BIND_ADDRESS decides who can reach the web front end. The default is the
# loopback address, which means "this machine only" — put the server behind
# WireGuard or Tailscale and set BIND_ADDRESS to its VPN address. One user
# does not need a public port, and not having one removes almost the whole
# attack surface at no maintenance cost.

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: quanta-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quanta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-quanta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # No `ports:` at all. Only the API talks to it, and it does so over
    # the internal network. Exposing a database that holds sealed exchange
    # keys is not worth the convenience of a local psql.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quanta} -d ${POSTGRES_DB:-quanta}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: quanta-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: quanta-api
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      COOKIE_SECURE: "true"

      # Two separate secrets: SECRET_KEY signs sessions, VAULT_MASTER_KEY
      # unwraps the exchange keys. Production refuses to start if the
      # second is missing or equal to the first.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in infra/.env}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY in infra/.env}

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quanta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quanta}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      CORS_ORIGINS: ${SITE_ORIGIN:-https://quanta.internal}

      # The address orders leave from, whitelisted on the exchange key.
      # Without it no key can be admitted at all, which is the right
      # failure (SPEC §3.5, §9).
      EXCHANGE_STATIC_IP: ${EXCHANGE_STATIC_IP:-}

      EXCHANGE_REST_URL: ${EXCHANGE_REST_URL:-https://fapi.bitunix.com}
      EXCHANGE_WS_URL: ${EXCHANGE_WS_URL:-wss://fapi.bitunix.com/public/}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Not published either: Caddy reaches it over the internal network.
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: quanta-web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      # The only port that leaves the stack. 127.0.0.1 by default; set
      # BIND_ADDRESS to the server's VPN address to reach it from your
      # other devices, and only to 0.0.0.0 if you have decided to put it
      # on the public internet and have read docs/DEPLOY.md first.
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      # Certificates and the local CA root survive a rebuild; without this
      # every deploy issues a new root and every device must trust it again.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
