name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: quanta
          POSTGRES_PASSWORD: quanta_dev_password
          POSTGRES_DB: quanta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quanta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://quanta:quanta_dev_password@localhost:5432/quanta
      TEST_DATABASE_URL: postgresql+asyncpg://quanta:quanta_dev_password@localhost:5432/quanta_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
      COOKIE_SECURE: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv .venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Create the test database
        run: |
          PGPASSWORD=quanta_dev_password psql -h localhost -U quanta -d quanta \
            -c "CREATE DATABASE quanta_test OWNER quanta;"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy quanta tests

      - name: Check migrations match the models
        run: |
          .venv/bin/alembic upgrade head
          # An empty autogenerate diff means no model change was left unmigrated.
          .venv/bin/alembic check

      - name: Test
        run: .venv/bin/pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
