name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv .venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy quanta_engine

      - name: Test
        run: .venv/bin/pytest -q

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: quanta
          POSTGRES_PASSWORD: quanta_dev_password
          POSTGRES_DB: quanta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quanta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://quanta:quanta_dev_password@localhost:5432/quanta
      TEST_DATABASE_URL: postgresql+asyncpg://quanta:quanta_dev_password@localhost:5432/quanta_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-used-outside-continuous-integration
      # Distinct from SECRET_KEY, so CI exercises the same separation a
      # deployment is required to have.
      VAULT_MASTER_KEY: ci-vault-master-key-not-used-outside-continuous-int
      COOKIE_SECURE: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # The engine is a path dependency, so uv resolves it from the repo.
        run: |
          uv venv .venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Create the test database
        run: |
          PGPASSWORD=quanta_dev_password psql -h localhost -U quanta -d quanta \
            -c "CREATE DATABASE quanta_test OWNER quanta;"

      # The tunnel tests run against the real WireGuard client too, two
      # peers and a real handshake; without the binary they are skipped,
      # so CI builds the same pinned version the image ships.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Build wireproxy
        run: |
          CGO_ENABLED=0 GOBIN="$RUNNER_TEMP/bin" \
            go install github.com/windtf/wireproxy/cmd/wireproxy@v1.1.3
          echo "WIREPROXY_TEST_BINARY=$RUNNER_TEMP/bin/wireproxy" >> "$GITHUB_ENV"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy quanta tests

      - name: Check migrations match the models
        run: |
          .venv/bin/alembic upgrade head
          # An empty autogenerate diff means no model change was left unmigrated.
          .venv/bin/alembic check

      - name: Test
        run: .venv/bin/pytest -q

      # The web job audits npm; this is the other half. A trading
      # platform's dependency tree is worth watching in both languages.
      #
      # The lockfile is audited rather than the installed environment, so
      # what CI checks is exactly what a deployment would install. The two
      # workspace packages are stripped: they are this repository's own
      # code, not a third-party supply chain, and pip-audit cannot resolve
      # an editable install against PyPI anyway.
      - name: Audit dependencies
        run: |
          uv pip install pip-audit
          uv export --no-emit-project --no-dev --format requirements-txt \
            | grep -v '^-e ' > /tmp/requirements-audit.txt
          .venv/bin/pip-audit -r /tmp/requirements-audit.txt --strict --desc

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree: a
          # key committed and then deleted is still in the repository.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
